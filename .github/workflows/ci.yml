name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate (self-checks + typecheck)
        run: npm run validate:all

      - name: Verify infrastructure (static)
        run: npm run verify:infra

      - name: Verify public marketplace URLs
        if: github.ref == 'refs/heads/main'
        run: npm run verify:infra -- --mode urls --base-url https://testhubspotapp.vercel.app
